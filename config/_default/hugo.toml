# Hugo configuration for YHY International Trade — tri-lingual static site
baseURL = '/'
languageCode = 'zh'
title = '山东钰弘源国际贸易有限公司'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
metaDataFormat = 'yaml'
summaryLength = 140

# Canonical URLs for SEO
canonifyURLs = false

# Enable HTML minification for faster page loads
[minify]
  minifyOutput = true
  disableCSS = false
  disableJS = false
  [minify.tdewolff.html]
    keepWhitespace = false

# Cloudflare Pages friendly - relative URLs
relativeURLs = true

# Disable unused output formats for speed
disableKinds = ['taxonomy', 'term']

# i18n — three languages with auto redirection handled by JS
[languages]
[languages.zh]
languageCode = 'zh-CN'
languageName = '中文'
weight = 1
title = '山东钰弘源国际贸易有限公司'
  [languages.zh.params]
  description = '山东钰弘源国际贸易有限公司是专业的商用车零部件授权供应商，专注SHACMAN陕汽、CNHTC中国重汽、WEICHAI潍柴、FAW解放等品牌配件，产品出口全球多国，提供一站式采购、质量保障与售后支持。'

[languages.en]
languageCode = 'en'
languageName = 'English'
weight = 2
title = 'Shandong Yuhongyuan International Trade Co., Ltd.'
  [languages.en.params]
  description = 'Shandong Yuhongyuan International Trade Co., Ltd. is a professional authorized supplier of commercial vehicle parts for SHACMAN, CNHTC, WEICHAI, FAW and more, exporting worldwide with one-stop sourcing and reliable after-sales support.'

[languages.ru]
languageCode = 'ru'
languageName = 'Русский'
weight = 3
title = 'Шаньдун Юйхуньюань Международная Торговая Компания, ООО'
  [languages.ru.params]
  description = 'Шаньдун Юйхуньюань — профессиональный авторизованный поставщик запчастей для коммерческих автомобилей SHACMAN, CNHTC, WEICHAI, FAW. Поставки по всему миру, комплексное сопровождение и надёжная поддержка.'

# Menus
[[menus.main]]
name = 'home'
weight = 1
identifier = 'home'
url = '/'

[[menus.main]]
name = 'about'
weight = 2
identifier = 'about'
url = '/about/'

[[menus.main]]
name = 'products'
weight = 3
identifier = 'products'
url = '/products/'

[[menus.main]]
name = 'services'
weight = 4
identifier = 'services'
url = '/services/'

[[menus.main]]
name = 'global'
weight = 5
identifier = 'global'
url = '/global/'

[[menus.main]]
name = 'contact'
weight = 6
identifier = 'contact'
url = '/contact/'

# Production overrides
[params]
company_full_name_zh = '山东钰弘源国际贸易有限公司'
company_full_name_en = 'Shandong Yuhongyuan International Trade Co., Ltd.'
company_full_name_ru = 'Шаньдун Юйхуньюань Международная Торговая Компания, ООО'
company_email = 'yhy@yhytradehub.com'
company_phone = '+86 186 0639 3111'
whatsapp_number = '8618606393111'
primary_color = '#165DFF'
primary_dark = '#0E42B3'