<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>页面未找到 · 山东钰弘源国际贸易有限公司</title>
<style>
  :root{--navy:#050d18;--navy2:#0f1f35;--gold:#c8954c;--gold2:#d4a24e;--muted:rgba(255,255,255,.62)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 30% 15%,#162742,var(--navy) 62%);
    color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px 20px;text-align:center;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;width:100%}
  .brand{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:26px}
  .code{font-family:Georgia,"Times New Roman",serif;font-size:clamp(5rem,20vw,9rem);line-height:.85;
    color:transparent;-webkit-text-stroke:2px rgba(200,149,76,.55);margin:0;letter-spacing:-.02em}
  h1{font-size:clamp(1.15rem,3.4vw,1.5rem);font-weight:600;margin:22px 0 12px;letter-spacing:.01em}
  p{font-size:14.5px;line-height:1.85;color:var(--muted);margin:0 0 8px}
  .alt{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:30px}
  .links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
  .links a{padding:12px 26px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:600;
    background:var(--gold);color:#0a1628;transition:background .2s}
  .links a.ghost{background:transparent;color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.25);font-weight:500}
  .links a:hover{background:var(--gold2)}
  .links a.ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(200,149,76,.6);color:#fff}
  .langs{display:flex;gap:18px;justify-content:center;font-size:12.5px;color:rgba(255,255,255,.35)}
  .langs a{color:rgba(255,255,255,.55);text-decoration:none;transition:color .2s}
  .langs a:hover{color:var(--gold2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Oceanlight &middot; YHY Trade Hub</div>
  <p class="code">404</p>
  <h1>这个页面不存在或已移除</h1>
  <p>可能是链接已更新，或者地址输错了。</p>
  <p class="alt">The page you are looking for could not be found.</p>
  <div class="links">
    <a href="/zh/">返回首页</a>
    <a href="/zh/products/" class="ghost">查看产品中心</a>
    <a href="/zh/contact/" class="ghost">联系我们</a>
  </div>
  <div class="langs">
    <a href="/zh/">中文</a>
    <a href="/en/">English</a>
    <a href="/ru/">Русский</a>
  </div>
</div>
</body>
</html>
